# Managed cloud only: keep the session CA out of image layers.
services:
  migrate:
    build:
      secrets:
        - ca_bundle
  api:
    build:
      secrets:
        - ca_bundle
  worker:
    build:
      secrets:
        - ca_bundle
  web:
    build:
      secrets:
        - ca_bundle
secrets:
  ca_bundle:
    file: /etc/ssl/certs/ca-certificates.crt
