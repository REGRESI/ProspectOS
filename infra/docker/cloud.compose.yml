# Managed cloud only: keep the session CA out of image layers.
services:
  migrate:
    build:
      secrets:
        - ca_bundle
  api:
    environment:
      SSL_CERT_FILE: /run/cloud-ca.pem
    volumes:
      - /etc/ssl/certs/ca-certificates.crt:/run/cloud-ca.pem:ro
    build:
      secrets:
        - ca_bundle
  worker:
    environment:
      SSL_CERT_FILE: /run/cloud-ca.pem
    volumes:
      - /etc/ssl/certs/ca-certificates.crt:/run/cloud-ca.pem:ro
    build:
      secrets:
        - ca_bundle
  web:
    build:
      secrets:
        - ca_bundle
secrets:
  ca_bundle:
    file: /etc/ssl/certs/ca-certificates.crt
