[project]
name = "prospectos-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.15,<2",
    "argon2-cffi>=23,<26",
    "python-multipart>=0.0.20,<1",
    "pydantic>=2.10,<3",
    "httpx>=0.28,<1",
    "PyJWT[crypto]>=2.10,<3",
    "cryptography>=50.0.2,<51",
    "pillow>=13.0.0,<14",
    "osmium>=4.3.2",
    "dnspython>=2.9.2",
]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
[tool.ruff]
line-length = 100
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form"]
